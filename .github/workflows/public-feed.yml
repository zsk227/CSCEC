name: Public feed

on:
  push:
    branches: [codex/cloudflare-pages]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read

concurrency:
  group: public-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Get the previous public feed
        run: |
          if git ls-remote --exit-code origin refs/heads/cloudflare-pages >/dev/null; then
            git fetch --depth=1 origin cloudflare-pages
            git show 'FETCH_HEAD:feed.json' > "$RUNNER_TEMP/previous-feed.json"
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Collect and check the static site
        run: |
          node lite/collect.ts lite/dist "$RUNNER_TEMP/previous-feed.json"
          node lite/build.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-feed
          path: lite/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref_name == github.event.repository.default_branch
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-feed
          path: ${{ runner.temp }}/public-feed
      - name: Update the branch served by Pages
        run: |
          if git ls-remote --exit-code origin refs/heads/cloudflare-pages >/dev/null; then
            git fetch --depth=1 origin cloudflare-pages
            git switch -C cloudflare-pages FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git switch --orphan cloudflare-pages
          fi
          cp "$RUNNER_TEMP/public-feed/"{index.html,sources.html,styles.css,app.js,topics.mjs,feed.json,favicon.ico,_headers} .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sources.html styles.css app.js topics.mjs feed.json favicon.ico _headers
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public industry feed'
          git push origin HEAD:refs/heads/cloudflare-pages
